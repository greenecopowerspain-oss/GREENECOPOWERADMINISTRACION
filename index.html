:root{--g:#0fa94b;--g2:#0a8a3a;--g3:#e9f7ef;--g4:#c9ecd6;--y:#ffd54a;--y2:#fff7d9;--y3:#b98a00;--ink:#17261c;--mut:#5f6f66;--line:#e2eae5;--bg:#f5faf6;--red:#cf3f3f;--red2:#fdeeee;--blue:#2563a8;--blue2:#e8f0fa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- Entrada ---- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#fff}
#login .sw{position:absolute;right:-180px;top:-200px;width:620px;height:620px;border-radius:50%;border:70px solid var(--g);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(10deg)}
#login .sw2{position:absolute;right:-230px;top:-150px;width:700px;height:700px;border-radius:50%;border:26px solid var(--y);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(10deg)}
.lbox{position:relative;z-index:2;width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:0 20px 60px #0a3a1a14;text-align:center}
.lbox img{width:200px;margin:0 auto 6px;display:block}
.lbox h2{margin:8px 0 4px;font-size:22px;font-weight:900}
.lbox p{margin:0 0 22px;color:var(--mut)}
.lbox .err{color:var(--red);font-weight:700;min-height:22px;margin:10px 0 0}
.demo{background:var(--y2);border:1px dashed var(--y3);color:#6b5200;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:16px;text-align:left}

/* ---- Estructura ---- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .logo{width:160px;margin:0 auto 20px;display:block}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:none;border-radius:14px;font-weight:800;color:var(--ink);text-align:left;font-size:15.5px}
nav button:hover{background:var(--g3)}
nav button.on{background:var(--g);color:#fff;box-shadow:0 6px 16px #0fa94b40}
nav .sep{height:1px;background:var(--line);margin:10px 6px}
aside .foot{margin-top:auto;font-size:12.5px;color:var(--mut);padding:0 8px;line-height:1.5}
main{padding:30px 34px 90px;max-width:1440px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.3px;position:relative;display:inline-block}
.top h1:after{content:"";position:absolute;left:0;bottom:-6px;width:56px;height:6px;border-radius:6px;background:var(--y)}
.top .sub{color:var(--mut);margin-top:12px}
.banner{background:var(--y2);border-bottom:1px solid #f1df9a;color:#6b5200;padding:8px 16px;font-size:14px;text-align:center;font-weight:700}

/* ---- Piezas ---- */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{margin:0 0 16px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px}
.card h3 .n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--y);font-size:14px}
.stack>*+*{margin-top:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
label{display:block;font-size:13.5px;font-weight:800;color:var(--mut);margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 13px;border:1.5px solid #d3dfd8;border-radius:12px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px #0fa94b1f}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input[readonly]{background:#f3f6f4;color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1.5px solid transparent;font-weight:800;font-size:15.5px;background:#fff;color:var(--ink);border-color:#d3dfd8;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.pri:hover{background:var(--g2)}
.btn.yel{background:var(--y);border-color:var(--y);color:#3d2f00}
.btn.yel:hover{background:#ffcc1f}
.btn.ghost{border-color:transparent;background:none;color:var(--g2)}
.btn.ghost:hover{background:var(--g3)}
.btn.danger{color:var(--red);border-color:#f0caca}
.btn.danger:hover{background:var(--red2);border-color:var(--red)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.big{padding:16px 22px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.chip.pendiente{background:var(--y2);color:#7a5c00}
.chip.cobrada,.chip.aceptado{background:var(--g3);color:var(--g2)}
.chip.rechazado{background:#f1f3f2;color:#6b7280}
.chip.facturado{background:var(--blue2);color:var(--blue)}
.chip.cat{background:#f1f5f3;color:#475a4f}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* ---- Inicio ---- */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.quick button{display:flex;align-items:center;gap:14px;padding:20px;border-radius:18px;border:1.5px solid var(--line);background:#fff;text-align:left;font-weight:900;font-size:17px;color:var(--ink)}
.quick button:hover{border-color:var(--g);box-shadow:0 8px 24px #0a3a1a12}
.quick .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.quick .ic svg{width:24px;height:24px}
.quick small{display:block;font-weight:600;color:var(--mut);font-size:13.5px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--g)}
.kpi.y:before{background:var(--y)}
.kpi.r:before{background:#9aa8a0}
.kpi .l{font-size:13.5px;font-weight:800;color:var(--mut)}
.kpi .v{font-size:27px;font-weight:900;margin-top:4px;letter-spacing:-.4px}
.kpi .s{font-size:13px;color:var(--mut);margin-top:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{font-size:13.5px;color:var(--mut)}
.mini .a{font-weight:900;white-space:nowrap}

/* ---- Editor ---- */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:24px;align-items:start}
.pv{position:sticky;top:20px}
.pv .lab{font-weight:800;color:var(--mut);font-size:13.5px;margin-bottom:8px;display:flex;justify-content:space-between}
.pvwrap{background:#fff;border-radius:10px;box-shadow:0 10px 40px #0a3a1a1f;overflow:hidden;position:relative}
.pvwrap .doc{transform-origin:top left;position:absolute;left:0;top:0}
.lhead{display:none}
.ln{display:grid;grid-template-columns:110px 150px minmax(0,1fr) 44px;grid-template-areas:"d d d d" "c p t x";gap:8px 10px;align-items:end;padding:12px 0;border-top:1px dashed var(--line)}
.ln:first-child{border-top:0;padding-top:0}
.ln .c{grid-area:c}.ln .d{grid-area:d}.ln .p{grid-area:p}.ln .x{grid-area:x}.ln .tot{grid-area:t;padding-bottom:12px}
.ln small{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:0 0 4px 2px}
.ln .tot{font-weight:800;text-align:right;padding-right:4px}
.ln .x{width:44px;height:44px;border-radius:12px;border:0;background:none;color:#a0aca5;display:flex;align-items:center;justify-content:center}
.ln .x:hover{background:var(--red2);color:var(--red)}
.totals{margin-top:16px;margin-left:auto;max-width:340px;background:var(--g3);border-radius:14px;padding:14px 18px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .big{font-size:20px;font-weight:900;border-top:1.5px solid var(--g4);margin-top:6px;padding-top:10px}
.savebar{position:sticky;bottom:0;background:#ffffffee;backdrop-filter:blur(6px);border-top:1px solid var(--line);margin:22px -34px -90px;padding:14px 34px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
.photo{width:100%;max-height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin-top:10px}
.tog{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer;margin:0;color:var(--ink);font-size:15.5px}
.tog input{width:22px;height:22px;accent-color:var(--g)}

.dict{background:linear-gradient(180deg,#fffbea,#fff);border-color:#f3e3a3}
.dict p{margin:-6px 0 12px;color:var(--mut);font-size:14.5px;line-height:1.45}
.dictbox{position:relative}
.dictbox textarea{min-height:96px;padding-right:76px}
.mic{position:absolute;right:10px;bottom:12px;width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px #0fa94b55}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--red);box-shadow:0 0 0 0 #cf3f3f88;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #cf3f3f66}70%{box-shadow:0 0 0 14px #cf3f3f00}100%{box-shadow:0 0 0 0 #cf3f3f00}}
.chip.ok{background:var(--g3);color:var(--g2)}
/* ---- Listas ---- */
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:10px 18px;border-radius:10px;font-weight:800;color:var(--mut)}
.tabs button.on{background:var(--g);color:#fff}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.it{display:grid;grid-template-columns:110px minmax(0,1fr) 120px 150px auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it:hover{background:#fbfdfc}
.it .num{font-weight:900;white-space:nowrap}
.it .num small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.it .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .who span{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.it .amt{font-weight:900;text-align:right;font-size:17px}
.it select{padding:7px 10px;font-size:14px;border-radius:10px;font-weight:700}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:11px;border:0;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--g3);color:var(--g2)}
.ib.r:hover{background:var(--red2);color:var(--red)}
.ib.y{color:#8a6a00}
.ib.y:hover{background:var(--y2)}
.git{grid-template-columns:100px minmax(0,1fr) 140px 120px auto}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.sum span{display:block;font-size:13px;color:var(--mut);font-weight:800}
.sum b{font-size:20px;font-weight:900}

/* ---- Ventanas ---- */
.ov{position:fixed;inset:0;background:#0b1f1366;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow:auto;z-index:60}
.modal{background:#fff;border-radius:22px;width:100%;max-width:680px;padding:24px 24px 20px;box-shadow:0 30px 80px #0008}
.modal h2{margin:0 0 18px;font-size:22px;font-weight:900}
.modal .row.end{margin-top:20px}
.drop{border:2px dashed #b8d9c5;border-radius:16px;padding:20px;text-align:center;background:var(--g3);cursor:pointer;color:var(--g2);font-weight:800}
.drop:hover{border-color:var(--g)}
.drop small{display:block;font-weight:600;color:var(--mut);margin-top:4px}
.file{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--g4);border-radius:14px;background:var(--g3)}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.viewer img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.viewer iframe{width:100%;height:70vh;border:0;border-radius:10px;background:#f3f3f3}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;z-index:90;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--red)}
.busy{position:fixed;inset:0;background:#ffffffb0;z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-weight:800}
.spin{width:44px;height:44px;border:5px solid var(--g4);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- Móvil ---- */
@media (max-width:1180px){.ed{grid-template-columns:1fr}.pv{position:static}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .top>div:first-child{flex:1 1 100%}
  .top select{width:100%!important}
  .it select{width:auto}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;box-shadow:0 -6px 20px #0a3a1a12}
  aside .logo,aside .foot,nav .sep,nav .ext{display:none}
  nav{flex-direction:row;justify-content:space-around}
  nav button{flex-direction:column;gap:3px;padding:7px 1px;font-size:10.5px;letter-spacing:-.2px;width:auto;flex:1 1 0;min-width:0;text-align:center;border-radius:12px;overflow:hidden}
  nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  nav button.on{box-shadow:none}
  main{padding:18px 14px 110px}
  .top h1{font-size:25px}
  .mlogo{display:block!important;width:120px;margin:0 0 14px}
  .quick,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:22px}
  .kpi{padding:14px 14px 14px 18px}
  .quick button{flex-direction:column;align-items:flex-start;padding:16px;font-size:15.5px}
  .quick button:last-child{grid-column:span 2}
  .two,.g2,.g3,.g4,.filters,.sum{grid-template-columns:1fr 1fr}
  .span2,.filters>:first-child{grid-column:span 2}
  .g2>*,.g3>*{grid-column:span 2}
  .g2>.half,.g3>.half{grid-column:span 1}
  .two{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px 16px}
  .card h3{flex-wrap:wrap}
  .mini{flex-wrap:wrap}
  .mini .t{flex-basis:60%}
  .ln{grid-template-columns:80px minmax(0,1fr) auto 40px}
  .ln .tot{font-size:14px}
  .it,.git{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .it .num{order:1}.it .amt{order:2}.it .who{order:3;grid-column:span 2}.it .st{order:4}.it .acts{order:5;justify-content:flex-end}
  .it .st select{max-width:170px}
  .savebar{margin:22px -14px -110px;padding:12px 14px 96px}
  .savebar .btn{flex:1}
  .modal{padding:20px 16px}
}
.mlogo{display:none;border-radius:12px}

/* ======== Documentos (formato de factura y presupuesto) ======== */
.doc{font-family:Arial,Helvetica,sans-serif;color:#000;width:794px;background:#fff}
.doc .page{width:794px;min-height:1122px;padding:62px 52px 40px;background:#fff;position:relative}
.doc b{font-weight:700}
/* Factura */
.fbox{border:2px solid #000;min-height:860px;display:flex;flex-direction:column}
.fhead{position:relative;height:320px;border-bottom:1.5px solid #000;padding:8px 6px}
.fimg{position:absolute;right:-2px;top:-2px;width:305px}
.ftitle{font-size:22px;font-weight:700}
.femi{margin-top:58px;font-size:10.5px;line-height:1.25}
.femi .fname{font-size:17px;display:block;margin-bottom:6px}
.fnum{position:absolute;left:6px;top:252px;display:grid;grid-template-columns:196px 260px;font-size:14px}
.fnum i{display:block;font-size:15px;margin-bottom:6px}
.fnum span{display:block;padding-left:66px}
.fnum div+div span{padding-left:0}
.fcli{display:grid;grid-template-columns:1fr 290px;height:150px;padding:6px 6px 0;border-bottom:1px solid #000}
.fcli .lbl{display:block;font-size:14.5px;margin-bottom:8px}
.fcli .cn{display:block;font-size:14.5px;margin-bottom:6px}
.fcli .sm{font-size:11.5px;line-height:1.28}
.fcli .up{font-size:10.5px;text-transform:uppercase}
.ftab{width:100%;border-collapse:collapse;font-size:13px}
.ftab th{border:1px solid #000;border-top:0;padding:4px;font-size:13.5px}
.ftab th:first-child{border-left:0}.ftab th:last-child{border-right:0}
.ftab td{height:21px;padding:2px 6px;text-align:center;border-left:1px solid #000;vertical-align:middle}
.ftab td:first-child{border-left:0}
.ftab tr:nth-child(even) td{background:#d9d9d9}
.ftab tbody tr:last-child td{border-bottom:1px solid #000}
.ftab col.a{width:116px}.ftab col.c{width:118px}.ftab col.d{width:98px}
.fsum{flex:1;display:grid;grid-template-columns:1fr 230px;font-size:13px;padding:4px 4px 0 6px}
.fobs .o{font-size:12px;margin-top:6px;white-space:pre-wrap;line-height:1.3}
.ftot div{display:grid;grid-template-columns:1fr 90px;padding:2px 0}
.ftot div span:last-child,.ftot div b:last-child{text-align:right}
.ftot div+div{margin-top:6px}
.ffoot{display:grid;grid-template-columns:352px 1fr;align-items:end;margin-top:auto}
.fbank{border:2px solid #000;border-left:0;border-bottom:0;padding:6px 6px 4px;font-size:13px;line-height:1.75}
.fbig{display:flex;justify-content:space-between;align-items:center;border:2px solid #000;margin:0 0 50px 118px;padding:3px 4px;font-size:15.5px;border-right:0}
.fbig b:last-child{font-size:18px}
/* Presupuesto */
.pre .page,.doc .page.pre{padding:58px 60px 40px}
.pbox{border:1.5px solid #000;min-height:960px;font-size:9.5px;display:flex;flex-direction:column}
.phead{position:relative;height:120px}
.pimg{position:absolute;right:-1px;top:-1px;width:186px}
.pemi{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:7.5px;line-height:1.6}
.pemi b{display:block;font-size:11px;margin-bottom:2px}
.ptit{padding:0 8px 10px;border-bottom:1px solid #000}
.ptit b{font-size:10px}
.ptit div{margin-top:2px;font-size:8.5px}
.ptit div span{display:inline-block;width:52px}
.pcli{display:grid;grid-template-columns:1fr 210px;padding:16px 8px 12px;border-bottom:1px solid #000;font-size:9px;line-height:1.45}
.pcli dl{margin:0;display:grid;grid-template-columns:58px 1fr}
.pcli dt{font-weight:700;font-style:italic}
.pcli dd{margin:0;font-weight:700;font-style:italic}
.pcli dd.n{font-weight:400;font-style:normal;color:#555}
.pcli .r dl{grid-template-columns:46px 1fr}
.pcli .r dd{font-weight:400;font-style:normal}
.ptab{padding:16px 8px 10px;min-height:250px;border-bottom:1px solid #000}
.ptab table{width:100%;border-collapse:collapse;font-size:8.5px}
.ptab th{text-align:left;font-size:9px;padding:0 0 2px}
.ptab td{padding:1.5px 0;vertical-align:top}
.ptab .c{text-align:center;width:50px}
.ptab .u{text-align:right;width:120px;padding-right:60px}
.ptab th.u{text-align:center;padding-right:0}
.ptab .t{text-align:right;width:90px}
.psum{padding:36px 8px 10px;border-bottom:1px solid #000}
.psum div,.ptotal{display:flex;justify-content:space-between}
.psum div+div{margin-top:3px}
.ptotal{padding:30px 8px 8px;border-bottom:1px solid #000}
.pval{padding:5px 8px;border-bottom:1px solid #000;font-size:8px}
.pnota{padding:14px 8px 0;font-size:7.6px;line-height:1.4}
.pnota p{margin:0 0 14px;white-space:pre-wrap}
.pbank{border:1.5px solid #000;display:inline-block;padding:2px 30px 2px 4px;margin-top:2px;line-height:1.35;border-left:0}
.pfirm{margin-top:auto;display:flex;justify-content:space-between;padding:0 16px 10px 16px;font-size:7.5px;text-align:center}
.pfirm div{width:130px}
.pfirm span{display:block;border-top:1px solid #000;margin-bottom:2px}
.p2{padding:20px 0 30px;align-items:center;min-height:960px}
.p2 h4{font-size:11px;margin:0 0 6px}
.p2 .lst{width:100%;display:grid;grid-template-columns:1fr 230px;padding:0 50px;font-size:9px}
.p2 .lst table{border-collapse:collapse;font-size:9px}
.p2 .lst td,.p2 .lst th{padding:1px 14px 1px 0;text-align:left}
.p2 .pot{text-align:center;font-size:9.5px;padding-top:14px}
.p2 .pot b{display:block}
.p2 img.foto{max-width:520px;max-height:520px;margin-top:28px;display:block}
.p2 .nofoto{margin-top:28px;width:420px;height:300px;border:1px dashed #999;display:flex;align-items:center;justify-content:center;color:#888}

#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  @page{size:A4;margin:0}
  .doc .page{page-break-after:always;min-height:1120px}
  .html2pdf__page-break{display:none}
}
</style>
</head>

function call(fn) {

  var p = DEMO ? new Promise(function (res) { setTimeout(function () { res(MOCK[fn].apply(null, args)); }, 120); })
    : API_URL ? post({ fn: fn, args: args, token: S.token })
    : new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(S.token, fn, args); });
  return p.then(function (r) {

}
function post(body) {

/* =================== Periodos =================== */
function rango(per) {
  var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1, q = Math.ceil(m / 3);
  var p2 = function (n) { return ('0' + n).slice(-2); };
  if (per === 'mes') return [y + '-' + p2(m) + '-01', y + '-' + p2(m) + '-31', MESES[m - 1] + ' ' + y];
  if (per === 'trim') return [y + '-' + p2(q * 3 - 2) + '-01', y + '-' + p2(q * 3) + '-31', q + 'º trimestre ' + y];
  if (/^t[1-4]$/.test(per)) { var t = +per[1]; return [y + '-' + p2(t * 3 - 2) + '-01', y + '-' + p2(t * 3) + '-31', t + 'º trimestre ' + y]; }
  if (per === 'ano') return [y + '-01-01', y + '-12-31', 'Año ' + y];
  if (per === 'anop') return [(y - 1) + '-01-01', (y - 1) + '-12-31', 'Año ' + (y - 1)];
  return ['0000', '9999', 'Todo'];
}
function enRango(f, r) { return f >= r[0] && f <= r[1]; }
function opcionesPeriodo(sel, conTodo) {
  var y = new Date().getFullYear();
  var o = [['mes', 'Este mes'], ['trim', 'Este trimestre'], ['t1', '1º trimestre ' + y], ['t2', '2º trimestre ' + y], ['t3', '3º trimestre ' + y], ['t4', '4º trimestre ' + y], ['ano', 'Este año'], ['anop', 'Año ' + (y - 1)]];
  if (conTodo) o.push(['todo', 'Todo']);
  return o.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === sel ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('');
}

/** Lector sencillo (sin IA): saca CIF, teléfono, email, IVA, cliente, dirección e importes. */
function leerDictado(t) {

  if (m) o.email = m[0].replace(/\s?arroba\s?/i, '@').replace(/\s?punto\s?/gi, '.').replace(/\s/g, '').toLowerCase();
  m = s.replace(/(\d)[\s.\-]+(?=\d)/g, '$1').match(/(?:\+34)?[6789]\d{8}\b/);

  if (m) { var c = m[1].toUpperCase().replace(/[^A-Z0-9]/g, ''), mm = c.match(/^([A-HJ-NP-SUVW]\d{7}[A-Z0-9]|\d{8}[A-Z]|[XYZ]\d{7}[A-Z])/); if (mm) o.cif = mm[1]; }

  if (/sujeto pasivo/.test(low)) o.observaciones = 'Inversión del sujeto pasivo';
  var conocido = S.clientes.filter(function (x) { return x.nombre && low.indexOf(x.nombre.toLowerCase()) >= 0; }).sort(function (a, b) { return b.nombre.length - a.nombre.length; })[0];
  if (conocido) o.cliente = conocido.nombre;
  else {
    m = s.match(/(?:a nombre de|factura a|presupuesto a|para el cliente|al cliente|cliente:?|para)\s+(.+?)(?=,|\.|;| con | cif| nif| dni| nie| en la | en el | en calle| en avenida| direcci| ubicad| tel[eé]fono| m[oó]vil|$)/i);
    if (m) o.cliente = m[1].trim().replace(/^(nombre de|la|el|los|las)\s+/i, '').replace(/^(la|el)\s+/i, '');
  }
  m = s.match(/((?:calle|c\/|avenida|avda\.?|avd\.?|plaza|camino|carrer|urbanizaci[oó]n|partida|pol[ií]gono|paseo)\s[^,;]+?\d+[a-z]?(?:\s?[,º°-]\s?\d+[a-zº°]*)?)/i);
  if (m) o.direccion = m[1].trim().replace(/^./, function (x) { return x.toUpperCase(); });

      .replace(/^\s*(y|más|mas|con|el|la|de)\s+/i, '').replace(/\b(?:factura|presupuesto) a .*$/i, '').trim();
    if (o.cliente && desc.toLowerCase().indexOf(o.cliente.toLowerCase()) >= 0) desc = desc.slice(desc.toLowerCase().indexOf(o.cliente.toLowerCase()) + o.cliente.length).replace(/^[\s,]+/, '');

    '<div class="grid g3"><div class="span2"><label>Clave de Google AI Studio</label><input id="iaKey" type="password" placeholder="' + (S.iaLista ? 'Ya hay una clave guardada' : 'AIza…') + '" autocomplete="off"></div><div style="display:flex;align-items:flex-end;gap:8px"><button class="btn pri" id="iaSave" style="flex:1">Guardar clave</button>' + (S.iaLista ? '<button class="btn danger" id="iaDel">Quitar</button>' : '') + '</div></div></div>' +
    '<div class="card"><h3>Sesión</h3><div class="row"><button class="btn" id="ajOut">' + ic('out') + 'Cerrar sesión en este dispositivo</button></div></div>' +
    (S.sheetUrl ? '<div class="card"><h3>Dónde se guarda todo</h3><p style="margin:0 0 14px;color:var(--mut)">En el Google Drive de la cuenta de la empresa. Solo se abre con esa cuenta.</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="' + esc(S.sheetUrl) + '">' + ic('hist') + 'Hoja de datos</a><a class="btn" target="_blank" rel="noopener" href="' + esc(S.folderUrl) + '">' + ic('drive') + 'Carpeta en Drive</a></div></div>' : '') +
    '</div>';
  $('#ajSave').onclick = function () {
    var o = {}; $$('#main [data-a]').forEach(function (el) { o[el.dataset.a] = el.value; });
    busy(true, 'Guardando…');
    call('saveAjustes', o).then(function (r) { busy(false); if (!r || !r.ok) return toast(msgErr(r), true); S.aj = r.ajustes; pintarNav(); marcar('ajustes'); toast('Ajustes guardados'); }).catch(function () { busy(false); });
  };
  $('#ajOut').onclick = function () { salir(); };
  function guardarIa(k) {
    busy(true, 'Comprobando la clave…');
    call('saveIaKey', k).then(function (r) {
      busy(false);
      if (!r || !r.ok) return toast('Google no acepta la clave: ' + (r && r.msg || ''), true);
      S.iaLista = r.iaLista; toast(r.iaLista ? 'Dictado con IA activado' : 'Clave quitada'); vAjustes();
    }).catch(function () { busy(false); });
  }
  $('#iaSave').onclick = function () { var k = $('#iaKey').value.trim(); if (!k) return toast('Pega la clave primero.', true); guardarIa(k); };
  if ($('#iaDel')) $('#iaDel').onclick = function () { guardarIa(''); };
  $('#lstSave').onclick = function () { $('#ajSave').click(); };
  $('#lstTest').onclick = function () {
    busy(true, 'Comprobando el listado…');
    call('probarListado').then(function (r) {
      busy(false);
      if (!r || !r.ok) return toast('No se puede abrir el listado: ' + (r && r.err || ''), true);
      toast('Conectado con «' + r.hoja + '» · ' + r.pestana + (r.ultima ? ' · última factura ' + r.ultima : ''));
    }).catch(function () { busy(false); });
  };
  $('#pwSave').onclick = function () {
    if ($('#pw1').value !== $('#pw2').value) return toast('Las dos contraseñas nuevas no coinciden.', true);
    call('changePassword', $('#pw0').value, $('#pw1').value).then(function (r) {
      if (!r || !r.ok) return toast(msgErr(r), true);
      $('#pw0').value = $('#pw1').value = $('#pw2').value = ''; toast('Contraseña cambiada');
    });
  };
}

$('#ov').addEventListener('mousedown', function (e) { if (e.target === this && !$('#gSave')) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#ov').classList.contains('hide')) closeModal(); });

/* =================== Vista de prueba (solo fuera de Google) =================== */
var HIST_DEMO = [];
var MOCK = {};

/* =================== Arranque =================== */
(function () {
  if (DEMO) $('#demoNote').classList.remove('hide');
  var tk = null; try { tk = sessionStorage.getItem('gep_tk'); } catch (e) { }
  if (tk) { S.token = tk; cargar(); } else setTimeout(function () { $('#pw').focus(); }, 100);
})();
</script>
